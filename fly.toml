# fly.toml app configuration file generated for whoop-mcp-falling-dust-2905 on 2026-03-27T14:59:10+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'whoop-mcp-falling-dust-2905'
primary_region = 'cdg'

[build]

[env]
  MCP_TRANSPORT = 'http'
  MCP_HOST = '0.0.0.0'
  MCP_PORT = '8080'
  BASE_URL = 'https://whoop.anas.link'
  FASTMCP_HOME = '/data/fastmcp'

# OAuth client registrations and upstream tokens live here, so claude.ai stays connected across machine restarts.
[mounts]
  source = 'whoop_mcp_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
